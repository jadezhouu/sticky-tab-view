name: CI Reanimated 3

# Reanimated 3 兼容维护线的 PR/push 门禁（V3-6-03）。
#
# 本工作流只承载 maintenance/reanimated-3 的 required checks（PR/push）：
#   * 全部 JS/package/typecheck/tarball checks（v3-lint / v3-typecheck / v3-test / v3-build-pack）
#   * Expo 53 Android Paper 原生构建 + Metro bundle 门禁（v3-expo-android-paper）
#   * RN 0.81 Android Fabric 原生构建 + Metro bundle 门禁（v3-rn081-android-fabric）
#
# nightly / release-candidate 的全八组合矩阵、candidate SHA 校验与 attestation
# 统一由 main 上的 .github/workflows/v3-native-dispatcher.yml 编排（schedule 与
# workflow_dispatch 只在默认分支生效），本文件不再重复——两处要同步演进，
# 且 job 名称与 ruleset 21985323 的 required checks 保持一致，避免控制面漂移。
#
# 每个锚点在原生构建之外强制跑一次 Metro bundle：assembleDebug 不经过 Metro，
# 只有 bundle 门禁能证明 JS 可被解析与转换（P0-06 / P1-05）。

on:
  push:
    branches: [maintenance/reanimated-3]
  pull_request:
    branches: [maintenance/reanimated-3]

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  # ────────────────────────── PR required：JS/package ──────────────────────────

  v3-lint:
    name: V3 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  v3-typecheck:
    name: V3 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  v3-test:
    name: V3 Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.4', '22.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  v3-build-pack:
    name: V3 Build & Pack Allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --dry-run

  # ──────────────────── PR required：两个 Android 原生构建 ─────────────────────

  # Expo 53 Android Paper（旧架构，newArchEnabled=false）
  v3-expo-android-paper:
    name: V3 Expo Android Paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build library (dist for Metro bundle gate)
        run: pnpm build
      - name: Record resolution evidence (Expo anchor)
        working-directory: example
        run: |
          echo "### require.resolve (Expo anchor)"
          node -e 'for (const m of ["react-native","react-native-reanimated","react-native-gesture-handler","react"]) console.log(m, "->", require.resolve(m, { paths: ["./node_modules"] }))'
          echo "### pnpm why --filter sticky-tab-view-example"
          pnpm --filter sticky-tab-view-example why react-native-reanimated react-native-gesture-handler react-native react
      - name: Export Expo bundle (Metro gate)
        working-directory: example
        env:
          ARCH: paper
        run: npx expo export --platform android --no-bytecode --output-dir .expo-export-gate
      - name: Prebuild Expo android (Paper)
        working-directory: example
        env:
          ARCH: paper
        run: npx expo prebuild --clean --platform android --no-install
      - name: Assert newArchEnabled=false
        working-directory: example
        run: grep -q '^newArchEnabled=false' android/gradle.properties
      - name: Build Expo android debug (Paper)
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon

  # RN CLI 0.81 Android Fabric（新架构，gradle.properties 默认 newArchEnabled=true）
  v3-rn081-android-fabric:
    name: V3 RN081 Android Fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build library (dist for Metro bundle gate)
        run: pnpm build
      - name: Record resolution evidence (RN CLI anchor)
        working-directory: fixtures/rn-081
        run: |
          echo "### require.resolve (RN CLI anchor)"
          node -e 'for (const m of ["react-native","react-native-reanimated","react-native-gesture-handler","react"]) console.log(m, "->", require.resolve(m, { paths: ["./node_modules"] }))'
          echo "### pnpm why --filter sticky-tab-view-fixture-rn081"
          pnpm --filter sticky-tab-view-fixture-rn081 why react-native-reanimated react-native-gesture-handler react-native react
          echo "### react-native config (autolinking)"
          npx react-native config | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log("deps:",Object.keys(d.dependencies||{}))})'
      - name: Bundle fixture (Metro gate)
        working-directory: fixtures/rn-081
        run: pnpm exec react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/rn081.bundle --assets-dest /tmp/rn081-assets
      - name: Assert newArchEnabled=true
        working-directory: fixtures/rn-081
        run: grep -q '^newArchEnabled=true' android/gradle.properties
      - name: Build fixture android debug (Fabric)
        working-directory: fixtures/rn-081/android
        run: ./gradlew assembleDebug --no-daemon
