name: Release

# npm Trusted Publishing 发布工作流。
#
# 触发方式：GitHub Release（published）自动触发；在 GitHub 事件未派发时，可由
# 维护者输入已发布的 Release tag 手动补发。两种方式都配合受保护的 `npm-release`
# environment，不由普通 push 自动发布。
#
# 认证：通过 OIDC（id-token: write）与 npm 建立信任，不使用长期 NPM_TOKEN。
#
# 环境要求（npm Trusted Publishing）：
#   - Node.js >= 22.14.0
#   - npm >= 11.5.1（Node 自带 npm 不满足，本工作流显式升级并打印版本留证）
#
# 版本策略（与 CONTRIBUTING / CHANGELOG 一致）：
#   - tag `v${version}` 必须与 package.json version 完全一致
#   - 2.x（Reanimated 4）预发布 → `next`，稳定版 → `latest`
#   - 1.x（Reanimated 3）预发布 → `reanimated3-next`，稳定版 → `reanimated3`
#   - 两条发布线按 Git tag major 互斥路由，避免 v1 Release 触发 v2 job 后标红。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag (for example, v2.0.0-beta.1)
        required: true
        type: string

env:
  # release 事件使用其 tag；手动补发必须显式指定同一个已发布 Release 的 tag。
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read
  id-token: write
  checks: read # 发布前核对 V1 Tag Validation check（P0-04：发布不能绕过 tag 验证）

concurrency:
  # 同一 tag 的并发发布保护：发布是低频高风险操作，禁止并发覆盖。
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-reanimated4:
    name: Publish Reanimated 4 line to npm
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v2.') }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 自动触发时 GitHub 已保证 release 为 published。手动补发时额外验证，防止
      # 把 workflow_dispatch 变成可绕过 Release 流程的任意 npm 发布入口。
      - name: Verify manual release target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release tag must start with v, got ${RELEASE_TAG}"
            exit 1
          fi
          RELEASE_JSON="$(gh release view "${RELEASE_TAG}" --json tagName,isDraft)"
          if [[ "$(jq -r '.tagName' <<< "${RELEASE_JSON}")" != "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag does not match ${RELEASE_TAG}"
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "${RELEASE_JSON}")" == "true" ]]; then
            echo "::error::Release ${RELEASE_TAG} is still a draft"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 固定满足 Trusted Publishing 的 Node 小版本（>= 22.14.0）
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 是 OIDC Trusted Publishing 的前置条件；打印版本留证。
      - name: Ensure npm >= 11.5.1
        run: |
          echo "node: $(node --version)"
          echo "npm before: $(npm --version)"
          if [[ "$(npm --version | cut -d. -f1)" -lt 11 ]]; then
            npm install -g npm@11.5.1
          fi
          echo "npm after: $(npm --version)"

      # 不缓存依赖：发布是低频、高风险操作，始终从锁文件干净安装。
      - run: pnpm install --frozen-lockfile

      # 发布前运行统一 release check（release:check 已包含真实 tarball 消费 smoke），失败即阻断发布。
      - run: pnpm release:check

      # 版本策略校验：tag 与 package.json 一致，且必须属于当前 2.x 发布线。
      - name: Verify version policy
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REF_TAG="${RELEASE_TAG#v}"
          if [[ "${REF_TAG}" != "${VERSION}" ]]; then
            echo "::error::Tag v${REF_TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          MAJOR="${VERSION%%\.*}"
          if [[ "${MAJOR}" != "2" ]]; then
            echo "::error::Current release line must be 2.x (Reanimated 4), got ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 从 version 推导 dist-tag：含预发布段 → next，否则 → latest。
      # 稳定版永远只到 latest，预发布永远只到 next，二者互不覆盖。
      - name: Derive dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

  publish-reanimated3:
    name: Publish Reanimated 3 line to npm
    if: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v1.') }}
    runs-on: ubuntu-latest
    # 当前 npm Trusted Publisher 已绑定这个受保护 environment；保留同一审批面，
    # 以免切换 environment 后 OIDC 身份与 npm 配置失配。
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify manual release target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release tag must start with v, got ${RELEASE_TAG}"
            exit 1
          fi
          RELEASE_JSON="$(gh release view "${RELEASE_TAG}" --json tagName,isDraft)"
          if [[ "$(jq -r '.tagName' <<< "${RELEASE_JSON}")" != "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag does not match ${RELEASE_TAG}"
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<< "${RELEASE_JSON}")" == "true" ]]; then
            echo "::error::Release ${RELEASE_TAG} is still a draft"
            exit 1
          fi

      - name: Verify Reanimated 3 maintenance branch
        run: |
          git fetch origin maintenance/reanimated-3:refs/remotes/origin/maintenance/reanimated-3
          if ! git merge-base --is-ancestor HEAD origin/maintenance/reanimated-3; then
            echo "::error::${RELEASE_TAG} is not reachable from maintenance/reanimated-3"
            exit 1
          fi

      # P0-04：npm publish 前必须在 HEAD（tag commit）上确认 V1 Tag Validation check
      # 成功。该 check 由 tag-validation.yml 在发布 tag 时执行，负责核对 GPG 签名、
      # 维护者指纹与 run-bound candidate attestation artifact；这里没有通过即禁止发布，
      # 防止 release.yml 变成绕过 tag 验证的发布入口。
      - name: Require V1 Tag Validation check success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_COMMIT="$(git rev-parse HEAD^{commit})"
          RUNS_JSON="$(gh api "repos/${{ github.repository }}/commits/$TAG_COMMIT/check-runs" --jq '.check_runs')"
          STATUS="$(printf '%s' "$RUNS_JSON" | node -e '
            const runs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const r = runs.find(r => r.name === "V1 Tag Validation");
            console.log(r ? (r.status === "completed" ? `completed/${r.conclusion}` : r.status) : "missing");
          ')"

          case "$STATUS" in
            completed/success) echo "V1 Tag Validation check: $STATUS (commit $TAG_COMMIT)";;
            *) echo "::error::V1 Tag Validation 未通过（got $STATUS），禁止发布 $RELEASE_TAG"; exit 1;;
          esac

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm >= 11.5.1
        run: |
          echo "node: $(node --version)"
          echo "npm before: $(npm --version)"
          if [[ "$(npm --version | cut -d. -f1)" -lt 11 ]]; then
            npm install -g npm@11.5.1
          fi
          echo "npm after: $(npm --version)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check

      - name: Verify Reanimated 3 version policy
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REF_TAG="${RELEASE_TAG#v}"
          if [[ "${REF_TAG}" != "${VERSION}" ]]; then
            echo "::error::Tag v${REF_TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          MAJOR="${VERSION%%\.*}"
          if [[ "${MAJOR}" != "1" ]]; then
            echo "::error::Reanimated 3 release line must be 1.x, got ${VERSION}"
            exit 1
          fi

      - name: Derive Reanimated 3 dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=reanimated3-next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=reanimated3" >> "$GITHUB_OUTPUT"
          fi

      # Reanimated 3 发布线必须完全不依赖 Worklets：检查 package.json 全部四个
      # dependency 字段与 pnpm-lock.yaml，命中即在 npm publish 前退出。
      # 拒绝策略、测试与文档中出现 react-native-worklets 字样不算失败。
      - name: Block react-native-worklets in Reanimated 3 package
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fields = ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"];
            let blocked = false;
            for (const field of fields) {
              if (pkg[field] && pkg[field]["react-native-worklets"]) {
                console.error("::error::react-native-worklets found in package.json " + field);
                blocked = true;
              }
            }
            if (fs.readFileSync("pnpm-lock.yaml", "utf8").includes("react-native-worklets")) {
              console.error("::error::react-native-worklets found in pnpm-lock.yaml");
              blocked = true;
            }
            process.exit(blocked ? 1 : 0);
          '
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Aborting Reanimated 3 publish because react-native-worklets is present"
            exit 1
          fi
          echo "OK: no react-native-worklets in package metadata or lockfile"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"
