name: V1 Tag Validation

# Reanimated 3 维护线的 `v1.*` tag 只验证、不发布 workflow（V3-6-04）。
#
# 用途：push v1.* tag 时立即校验 tag/version/维护分支可达性/签名/候选证据，
# 在创建 GitHub Release 之前给出明确 validation check。发布仍只由 release.published
# 触发 release.yml，本 workflow 不使用 npm-release environment，也不执行 npm publish。
#
# 机制（与维护指南第 11 节一致）：
#   - 固定可信签名公钥 fingerprint；没有可信公钥时本 workflow fail-closed，
#     不允许把 git verify-tag 写成可假通过的自动门禁（V3-6-04 第 3 点）。
#     所有 gpg 操作（导入 + git verify-tag）共用 GNUPGHOME，保证验证用的就是
#     导入这张公钥的 keyring（P0-04）。
#   - 通过 GitHub Actions API 定位 v3-native-dispatcher.yml 上 head_sha == tag commit
#     的成功 release-candidate run，按 `<short-sha>-<run-id>` 计算并下载
#     v3-candidate-attestation artifact，核对 candidate_sha == head_sha == tag commit
#     且 workflow_run_id == 该 run id（P1-03：不再按“最新同名 artifact”模糊匹配）。
#   - 校验全部通过前，不得创建 GitHub Release（操作门禁由维护者执行）。

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: read
  actions: read # 读取 candidate attestation artifact

env:
  # 维护者签名公钥存放路径（人工在 Phase 8 放入，见 docs/reanimated3-native-builds.md）。
  VERIFIER_KEY: .github/keys/reanimated3-maintainer.gpg.pub.asc
  # 固定预期的公钥 fingerprint（十六进制指纹，人类任务填写；留空则 fail-closed）。
  EXPECTED_FINGERPRINT: ''

jobs:
  validate-v1-tag:
    name: V1 Tag Validation
    runs-on: ubuntu-latest
    env:
      # 所有 gpg 子进程（import / git verify-tag）共用同一个 keyring，
      # 避免 verify-tag 落到 ~/.gnupg 找不到刚导入的公钥（P0-04）。
      GNUPGHOME: ${{ github.workspace }}/.gpg-tmp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag shape (v1.*)
        run: |
          REF="${{ github.ref }}"
          echo "pushed ref: $REF"
          case "$REF" in
            refs/tags/v1.*) echo "tag shape OK" ;;
            *) echo "::error::expected v1.* tag, got $REF"; exit 1 ;;
          esac

      - name: Validate tag is annotated and exists as tag object
        run: |
          TAG_OBJ="$(git rev-parse "${{ github.ref }}")"
          if [ "$(git cat-file -t "$TAG_OBJ")" != "tag" ]; then
            echo "::error::v1.* 发布 tag 必须是 annotated 签名 tag（got ${{ github.ref }} → $TAG_OBJ）"
            exit 1
          fi
          echo "tag_object=$TAG_OBJ" >> "$GITHUB_ENV"
          echo "tag_commit=$(git rev-parse "$TAG_OBJ^{commit}")" >> "$GITHUB_ENV"

      - name: Validate package.json version matches tag
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          EXPECTED="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json version ($VERSION) != tag version ($EXPECTED)"
            exit 1
          fi
          echo "version match: $VERSION"

      - name: Validate tag commit belongs to maintenance/reanimated-3
        run: |
          git fetch origin maintenance/reanimated-3:refs/remotes/origin/maintenance/reanimated-3 --depth=300
          TAG_COMMIT="$(git rev-parse "${{ github.ref }}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/maintenance/reanimated-3; then
            echo "::error::tag commit $TAG_COMMIT 不是 maintenance/reanimated-3 的祖先"
            exit 1
          fi
          echo "tag reachable from maintenance/reanimated-3: OK"

      - name: Verify GPG signature against pinned public key (fail-closed)
        run: |
          if [ ! -f "$VERIFIER_KEY" ]; then
            echo "::error::缺少可信签名公钥：$VERIFIER_KEY（Phase 8 人工任务：放入维护者导出公钥）"
            exit 1
          fi
          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::EXPECTED_FINGERPRINT 未填写，不能把 verify-tag 当可过的门禁"
            exit 1
          fi
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$VERIFIER_KEY" 2>/dev/null
          # 取第一条 fpr 记录 = 主密钥指纹（subkey 的 fpr 会排在其后），
          # 避免 awk 取到子密钥指纹导致固定比对失效（P0-04）。
          FP="$(gpg --with-colons --fingerprint --import-options show-only --import "$VERIFIER_KEY" 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
          if [ "$FP" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::公钥 fingerprint 不匹配：got $FP, want $EXPECTED_FINGERPRINT"
            exit 1
          fi
          git -c gpg.program="$(command -v gpg)" verify-tag --raw "${{ github.ref_name }}"
          echo "GPG signature OK (primary fingerprint $FP)"

      - name: Verify tag commit matches candidate attestation (run-bound)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_COMMIT="$(git rev-parse "${{ github.ref }}^{commit}")"
          SHORT_SHA="${TAG_COMMIT:0:8}"

          # 定位 v3-native-dispatcher.yml 上 head_sha == tag commit 的
          # 成功 workflow_dispatch run（release-candidate 模式，P1-03）。
          RUN_JSON="$(gh api "repos/${{ github.repository }}/actions/workflows/v3-native-dispatcher.yml/runs?head_sha=$TAG_COMMIT&status=success&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[0]')"
          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            echo "::error::未找到 head_sha == $TAG_COMMIT 的成功 v3-native-dispatcher run（release-candidate 未完成，禁止发布）"
            exit 1
          fi
          RUN_ID="$(printf '%s' "$RUN_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')"
          echo "matched run_id: $RUN_ID (head_sha=$TAG_COMMIT)"

          EXPECTED_ARTIFACT="v3-candidate-attestation-${SHORT_SHA}-${RUN_ID}"
          ARTIFACT_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.expired==false and .name==\"$EXPECTED_ARTIFACT\") | .id" | head -1)"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::run $RUN_ID 上没有 $EXPECTED_ARTIFACT artifact：候选设备证据未固化，禁止发布"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/attestation.zip
          rm -rf /tmp/attestation && mkdir -p /tmp/attestation && cd /tmp/attestation && unzip -o -q /tmp/attestation.zip

          CAND_SHA="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/attestation/attestation.json","utf8")).candidate_sha')"
          HEAD_SHA="$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/attestation/attestation.json","utf8")).head_sha')"
          ATTEST_RUN_ID="$(node -p 'String(JSON.parse(require("fs").readFileSync("/tmp/attestation/attestation.json","utf8")).workflow_run_id)')"
          echo "tag_commit=$TAG_COMMIT candidate_sha=$CAND_SHA head_sha=$HEAD_SHA workflow_run_id=$ATTEST_RUN_ID"
          if [ "$CAND_SHA" != "$TAG_COMMIT" ] || [ "$HEAD_SHA" != "$TAG_COMMIT" ]; then
            echo "::error::tag commit 与 attestation 的 candidate_sha/head_sha 不一致"
            exit 1
          fi
          if [ "$ATTEST_RUN_ID" != "$RUN_ID" ]; then
            echo "::error::attestation 的 workflow_run_id（$ATTEST_RUN_ID）与定位到的 run（$RUN_ID）不一致"
            exit 1
          fi
          echo "candidate evidence aligned (run-bound): OK"

      - name: Summary
        run: |
          echo "V1 Tag Validation PASSED: ${{ github.ref_name }}"
          echo "  tag_object=${{ env.tag_object }}"
          echo "  tag_commit=${{ env.tag_commit }}"
