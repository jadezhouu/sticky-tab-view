name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible so we can reproduce it.
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: e.g. 2.0.0-beta.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps or a small code snippet that reproduces the issue. A link to a minimal reproduction repo is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant console output, error messages, or crash logs.
      render: text
  - type: input
    id: react-native
    attributes:
      label: React Native version
      placeholder: e.g. 0.81.5
  - type: input
    id: reanimated
    attributes:
      label: react-native-reanimated version
      placeholder: e.g. 4.1.1
  - type: input
    id: worklets
    attributes:
      label: react-native-worklets version
      placeholder: e.g. 0.5.2
  - type: input
    id: gesture-handler
    attributes:
      label: react-native-gesture-handler version
      placeholder: e.g. 2.28.0
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture (Fabric)
        - Paper (Legacy)
        - Unsure
  - type: dropdown
    id: toolchain
    attributes:
      label: Toolchain
      options:
        - Expo
        - React Native CLI
  - type: input
    id: platform
    attributes:
      label: Platform & OS version
      placeholder: e.g. iOS 17.5, Android 14
