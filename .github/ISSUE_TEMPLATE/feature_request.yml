name: Feature request
description: Suggest an idea for this library
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the feature and the problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Is your request related to a use case the library currently does not cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us evaluate the request.
